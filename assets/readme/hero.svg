<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img"
     aria-labelledby="heroTitle heroDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif">
  <title id="heroTitle">Bilingual EPUB Toolkit</title>
  <desc id="heroDesc">Merge two monolingual EPUBs into one bilingual book. A specimen
    page shows an English paragraph in focus with its French translation blurred
    underneath, the way the generated book hides a translation until it is tapped.</desc>

  <defs>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.1"/>
    </filter>
    <filter id="softenLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <clipPath id="pageClip">
      <rect x="700" y="54" width="446" height="272" rx="14"/>
    </clipPath>
  </defs>

  <!-- self-supplied background: keeps the panel readable on GitHub light and dark -->
  <rect width="1200" height="380" fill="#fbf9f6"/>
  <rect x="0" y="0" width="7" height="380" fill="#8a5a2b"/>

  <!-- left: identity -->
  <text x="66" y="86" font-size="19" font-weight="600" letter-spacing="2.6"
        fill="#a8998a">EPUB · LOCAL · CLI + TERMINAL + WEB</text>

  <text x="64" y="163" font-size="60" font-weight="700" letter-spacing="-1.2" fill="#23201c">
    Bilingual EPUB Toolkit
  </text>

  <text x="66" y="212" font-size="25" fill="#6b635a">
    Two monolingual EPUBs in, one facing-text book out —
  </text>
  <text x="66" y="246" font-size="25" fill="#6b635a">
    the translation stays blurred until you tap it.
  </text>

  <!-- the three verbs, as the tool actually names them -->
  <g font-size="20" font-weight="600">
    <rect x="66" y="284" width="104" height="38" rx="19" fill="#f3e9dd"/>
    <text x="118" y="309" fill="#8a5a2b" text-anchor="middle">merge</text>
    <rect x="182" y="284" width="94" height="38" rx="19" fill="#f3e9dd"/>
    <text x="229" y="309" fill="#8a5a2b" text-anchor="middle">split</text>
    <rect x="288" y="284" width="126" height="38" rx="19" fill="#f3e9dd"/>
    <text x="351" y="309" fill="#8a5a2b" text-anchor="middle">remerge</text>
  </g>

  <!-- right: a specimen of the output -->
  <rect x="700" y="54" width="446" height="272" rx="14" fill="#ffffff" stroke="#e6e0d8" stroke-width="1.5"/>

  <g clip-path="url(#pageClip)">
    <!-- chapter line -->
    <text x="730" y="98" font-size="17" font-weight="600" letter-spacing="1.6" fill="#a8998a">
      CHAPTER ONE
    </text>

    <!-- A side: in focus -->
    <text x="730" y="139" font-size="22" fill="#23201c">It was a bright cold day</text>
    <text x="730" y="168" font-size="22" fill="#23201c">in the invented town.</text>

    <!-- B side: blurred, the way the book renders it before a tap -->
    <g filter="url(#soften)">
      <text x="730" y="211" font-size="22" fill="#3c3833">C’était une journée froide</text>
      <text x="730" y="240" font-size="22" fill="#3c3833">et lumineuse dans la ville</text>
      <text x="730" y="269" font-size="22" fill="#3c3833">inventée.</text>
    </g>

    <!-- tap affordance: carries the meaning even if the filter is dropped -->
    <g transform="translate(1064, 236)">
      <circle r="27" fill="#8a5a2b" opacity="0.10"/>
      <circle r="17" fill="#8a5a2b" opacity="0.18"/>
      <circle r="8.5" fill="#8a5a2b"/>
    </g>
  </g>

  <text x="923" y="356" font-size="18" fill="#a8998a" text-anchor="middle">
    tap to reveal
  </text>
</svg>
